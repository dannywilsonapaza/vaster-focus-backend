services:
  postgres:
    image: postgres:16-alpine
    container_name: vaster-focus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaster_focus
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - vaster_focus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vaster_focus_pgdata:
